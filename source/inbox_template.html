  }

  }
  function setupFilters(){const senders=new Map();for(const m of messages){const key=senderKey(m);if(!senders.has(key))senders.set(key,{key,name:m.fromName,email:m.fromEmail,count:0,aliases:new Set()});const sender=senders.get(key);sender.count++;sender.aliases.add(m.fromRaw);}senderChoices=[...senders.values()].sort((a,b)=>a.name.localeCompare(b.name));for(const sender of senderChoices)sender.search=norm([sender.name,sender.email,...sender.aliases].join(' '));}

  function renderReader(){
    const m=byId.get(state.selected),scroll=$('reader-scroll');
    for(const id of ['toggle-read','toggle-star','copy-message','download-message','print-message'])$(id).disabled=!m;
    const position=results.findIndex(x=>x.id===state.selected);$('message-position').textContent=m?(position+1)+' of '+number(results.length):'';$('previous-message').disabled=!m||position<=0;$('next-message').disabled=!m||position>=results.length-1;
    if(!m){scroll.replaceChildren();const empty=el('div','empty');const illustration=el('div','empty-illustration');illustration.append(icon('mail'));empty.append(illustration,el('h2','','Room for a good conversation.'),el('p','','Choose an email from the list to read it here.'));scroll.append(empty);return;}
    $('toggle-read').title=isRead(m)?'Mark as unread':'Mark as read';$('toggle-read').setAttribute('aria-label',$('toggle-read').title);$('toggle-star').title=isStarred(m)?'Unstar email':'Star email';$('toggle-star').setAttribute('aria-label',$('toggle-star').title);$('toggle-star').setAttribute('aria-pressed',String(isStarred(m)));$('toggle-star').style.color=isStarred(m)?'#d4a247':'';$('toggle-star').querySelector('svg').style.fill=isStarred(m)?'#e5b752':'';
    const inner=el('article','reader-inner');inner.setAttribute('aria-label',m.subject);const subject=el('h2','reader-subject');appendHighlighted(subject,m.subject);inner.append(subject);
    const labels=el('div','reader-labels');for(const label of m.labels.filter(l=>!['Opened','Unread','Starred'].includes(l)))labels.append(el('span','reader-label',label));inner.append(labels);
    const metaBox=el('div','reader-meta'),main=el('div','meta-main'),line=el('div','sender-line');line.append(el('strong','',m.fromName));if(m.fromEmail && m.fromName!==m.fromEmail)line.append(el('span','sender-address','<'+m.fromEmail+'>'));main.append(line);const recipients=el('div','recipient-line');recipients.append(el('span','recipient-label','to'),el('span','recipient-text',m.to||'(No recipient header)'));const detailsButton=el('button','details-toggle');detailsButton.title='Show full email headers';detailsButton.setAttribute('aria-label','Show full email headers');detailsButton.setAttribute('aria-expanded','false');detailsButton.append(icon('down'));recipients.append(detailsButton);main.append(recipients);const date=el('div','reader-date',fullDate(m));date.title=m.dateRaw;date.append(document.createElement('br'),el('small','',timeDate(m)));metaBox.append(avatar(m),main,date);inner.append(metaBox);
    const details=el('dl','message-details');for(const [name,value] of [['From',m.fromRaw],['To',m.to],['Cc',m.cc],['Bcc',m.bcc],['Date',m.dateRaw],['Subject',m.subject],['Message-ID',m.messageId]]){if(value){const row=el('div','detail-row');row.append(el('dt','',name),el('dd','',value));details.append(row);}}detailsButton.addEventListener('click',()=>{const open=details.classList.toggle('open');detailsButton.setAttribute('aria-expanded',String(open));});inner.append(details);
    const controls=el('div','view-controls'),textButton=el('button','view-tab','Text'),htmlButton=el('button','view-tab','Formatted');textButton.type=htmlButton.type='button';textButton.setAttribute('aria-pressed','false');htmlButton.setAttribute('aria-pressed','false');htmlButton.disabled=!m.html;htmlButton.title=m.html?'View safe original email formatting':'No HTML version in this email';controls.append(textButton,htmlButton);const indicator=el('span','body-indicator');indicator.append(icon('lock'),document.createTextNode('Remote content blocked'));controls.append(indicator);inner.append(controls);
    const body=el('div','message-body');appendHighlighted(body,m.body||'(This email has no text body.)',true);inner.append(body);
    let frame=null;
    function setView(view){if(view==='formatted'&&!m.html)view='text';state.view=view;const formatted=view==='formatted';textButton.classList.toggle('active',!formatted);htmlButton.classList.toggle('active',formatted);textButton.setAttribute('aria-pressed',String(!formatted));htmlButton.setAttribute('aria-pressed',String(formatted));body.hidden=formatted;
      if(formatted&&!frame){frame=el('iframe','formatted-frame');frame.title='Formatted email: '+m.subject;frame.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox');frame.setAttribute('referrerpolicy','no-referrer');frame.srcdoc='<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:; base-uri \'none\'; form-action \'none\'"><style>html{color:#596176;background:white}body{font:13px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:6px 0 20px;overflow-wrap:anywhere}table{max-width:100%!important}a{color:#6378c5}img{max-width:100%}pre{white-space:pre-wrap}blockquote{margin-left:12px;border-left:2px solid #e6e9f3;padding-left:14px}.image-label{color:#a0a8b8;font-size:11px}*{box-sizing:border-box;max-width:100%}</style></head><body>'+m.html+'</body></html>';body.after(frame);}if(frame)frame.hidden=!formatted;
    }
    textButton.addEventListener('click',()=>setView('text'));htmlButton.addEventListener('click',()=>setView('formatted'));setView(state.view);
    if(m.attachments.length){const section=el('section','attachments-section'),heading=el('h3','attachments-heading');heading.append(icon('clip'),document.createTextNode(m.attachments.length+' attachment'+(m.attachments.length===1?'':'s')));section.append(heading);const grid=el('div','attachment-grid');for(const attachment of m.attachments){const a=el('a','attachment-card');a.href=attachment.path;a.download=attachment.name;a.title=attachment.name+' · '+fileSize(attachment.size);const extension=attachment.name.includes('.')?attachment.name.split('.').pop().toUpperCase().slice(0,5):'FILE';const type=el('span','file-type'+(attachment.type==='application/pdf'?' pdf':attachment.type.startsWith('image/')?' image':''),extension);const info=el('span','attachment-info'),name=el('div','attachment-name');appendHighlighted(name,attachment.name);info.append(name,el('div','attachment-size',fileSize(attachment.size)+(attachment.inline?' · inline image':'')));a.append(type,info,icon('download'));grid.append(a);}section.append(grid);if(m.attachments.some(a=>a.inline))section.append(el('p','inline-note','Images embedded in the original email are included as attachment files.'));inner.append(section);}
    scroll.replaceChildren(inner);
  }
  function resetFilters(){clearTimeout(debounce);Object.assign(state,{label:'',sender:'',senderText:'',query:'',terms:[],from:'',to:''});$('search').value='';$('sender-filter').value='';$('sender-filter').title='';$('clear-sender').hidden=true;closeSenders();$('date-from').value='';$('date-to').value='';$('clear-search').classList.remove('show');highlightRegex=null;applyFilters();}
  function changeStar(m){saved.star[m.id]=!isStarred(m);save();const scroll=$('message-list').scrollTop;applyFilters();$('message-list').scrollTop=scroll;}
  function messageText(m){let text=m.subject+'\nFrom: '+m.fromRaw+'\nTo: '+m.to+'\n';for(const [name,value] of [['Cc',m.cc],['Bcc',m.bcc],['Date',m.dateRaw],['Labels',m.labels.join(', ')],['Message-ID',m.messageId]])if(value)text+=name+': '+value+'\n';text+='\n'+(m.body||'[No text body]');if(m.attachments.length)text+='\n\nAttachments:\n'+m.attachments.map(a=>'- '+a.name+' ('+fileSize(a.size)+')').join('\n');return text;}
  function download(content,name,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type}));const a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function moveMessage(delta){const at=results.findIndex(m=>m.id===state.selected);const next=results[at+delta];if(!next)return;if(at+delta>=state.limit){state.limit+=50;renderList();}selectMessage(next.id,true);$('message-list').querySelector('[data-id="'+next.id+'"]')?.scrollIntoView({block:'nearest'});}
  function closeMenu(){document.body.classList.remove('menu-open');$('menu-toggle').setAttribute('aria-expanded','false');}
  $('search').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(updateSearch,120);});$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(debounce);updateSearch();}});
  $('clear-search').addEventListener('click',()=>{clearTimeout(debounce);$('search').value='';updateSearch();$('search').focus();});
  $('sender-filter').addEventListener('focus',showSenders);
  $('sender-filter').addEventListener('click',()=>{if($('sender-options').hidden)showSenders();});
  $('sender-filter').addEventListener('input',()=>{state.sender='';state.senderText=$('sender-filter').value.trim();$('sender-filter').title='';$('clear-sender').hidden=!state.senderText;showSenders();applyFilters();});
  $('sender-filter').addEventListener('blur',closeSenders);
  $('sender-filter').addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key))e.stopPropagation();if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if($('sender-options').hidden)showSenders();if(senderMatches.length)highlightSender((senderActive+(e.key==='ArrowDown'?1:senderActive<0?0:-1)+senderMatches.length)%senderMatches.length);}else if(e.key==='Enter'&&!$('sender-options').hidden&&senderMatches.length){e.preventDefault();pickSender(senderMatches[Math.max(0,senderActive)]);}else if(e.key==='Escape'){e.preventDefault();closeSenders();}else if(e.key==='Tab')closeSenders();});
  $('clear-sender').addEventListener('click',()=>{clearSender();$('sender-filter').focus();});
  $('date-toggle').addEventListener('click',()=>{const open=$('more-filters').classList.toggle('open');$('date-toggle').setAttribute('aria-expanded',String(open));});
  for(const [id,key] of [['date-from','from'],['date-to','to']])$(id).addEventListener('change',()=>{state[key]=$(id).value;applyFilters();});
  $('reset-filters').addEventListener('click',resetFilters);$('sort').addEventListener('change',()=>{state.sort=$('sort').value;applyFilters(false);});
  $('toggle-star').addEventListener('click',()=>{const m=byId.get(state.selected);if(m)changeStar(m);});$('toggle-read').addEventListener('click',()=>{const m=byId.get(state.selected);if(!m)return;const read=!isRead(m);saved.read[m.id]=read;save();const top=$('reader-scroll').scrollTop;applyFilters();$('reader-scroll').scrollTop=top;toast(read?'Marked as read':'Marked as unread');});
  $('download-message').addEventListener('click',()=>{const m=byId.get(state.selected);if(m)download(messageText(m),m.subject.replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').slice(0,120)+'.txt');});
  $('download-results').addEventListener('click',()=>{clearTimeout(debounce);updateSearch();if(!results.length)return;const filters=[['View',$('folder-title').textContent],['Search',state.query],['Sender',state.sender||state.senderText],['Label',state.label],['From date',state.from],['To date',state.to]].filter(([,value])=>value).map(([name,value])=>name+': '+value).join('\n');const content='EMAIL SEARCH RESULTS\n'+results.length+' messages\n'+filters+'\n\n'+results.map(m=>'='.repeat(80)+'\n'+messageText(m)).join('\n\n');download(content,'Email search results.txt');toast('Exported '+number(results.length)+' messages');});
  $('copy-message').addEventListener('click',async()=>{const m=byId.get(state.selected);if(!m)return;const text=messageText(m);try{await navigator.clipboard.writeText(text);toast('Email copied');}catch(_){const area=el('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();toast(copied?'Email copied':'Use Download to save this email as text');}});
  $('print-message').addEventListener('click',()=>window.print());$('previous-message').addEventListener('click',()=>moveMessage(-1));$('next-message').addEventListener('click',()=>moveMessage(1));
  $('menu-toggle').addEventListener('click',()=>{const open=document.body.classList.toggle('menu-open');$('menu-toggle').setAttribute('aria-expanded',String(open));});$('sidebar-close').addEventListener('click',closeMenu);$('mobile-shade').addEventListener('click',closeMenu);$('mobile-back').addEventListener('click',()=>$('app').classList.remove('reader-open'));
  document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus();$('search').select();return;}if(e.key==='Escape'){if(typing)document.activeElement.blur();else if(document.body.classList.contains('menu-open'))closeMenu();else $('app').classList.remove('reader-open');return;}if(typing||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='/'){e.preventDefault();$('search').focus();}if(e.key==='j')moveMessage(1);if(e.key==='k')moveMessage(-1);});
  setupFilters();applyFilters();
})();
</script>
